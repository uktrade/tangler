name: CI
on:
  pull_request:
    branches:
      - main

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup uv and just toolchain
        uses: uktrade/actions-data-matching/setup-toolchain@f67fade25dc6c04707d341d6c524b81db42514a5 # v1.0.0

      - name: Format and lint
        run: just format

  test:
    name: test ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Setup uv and just toolchain
        uses: uktrade/actions-data-matching/setup-toolchain@f67fade25dc6c04707d341d6c524b81db42514a5 # v1.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python tests
        run: uv run pytest

  build-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup uv and just toolchain
        uses: uktrade/actions-data-matching/setup-toolchain@f67fade25dc6c04707d341d6c524b81db42514a5 # v1.0.0
        with:
          install-just: "false"

      - run: uv build

  ci-success:
    needs: [format-and-lint, test, build-package]
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: CI Success
        run: echo "All CI checks passed!"
