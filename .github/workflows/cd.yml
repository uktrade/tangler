name: CD

on:
  release:
    types: [published]

jobs:
  build-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup uv and just toolchain
        uses: uktrade/actions-data-matching/setup-toolchain@f67fade25dc6c04707d341d6c524b81db42514a5 # v1.0.0
        with:
          fetch-depth: 0
          install-just: "false"

      - name: Build package
        run: uv build

      - name: Upload package artefact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          path: ./dist

  deploy-package:
    needs: build-package
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    environment: pypi

    steps:
      - name: Download package artefact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          packages-dir: artifact/
